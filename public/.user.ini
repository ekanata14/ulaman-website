; Batas unggah berkas untuk PHP-FPM/CGI (mod_php memakai public/.htaccess).
; Selaras dengan UPLOAD_MAX_KB di .env & config/ulaman.php.
;
; Livewire mengirim SEMUA berkas terpilih dalam satu request ke /livewire/upload-file,
; jadi post_max_size harus menampung total satu pemilihan (maks 5 berkas × batas per berkas).
; Nginx juga perlu: client_max_body_size 512M;

upload_max_filesize = 128M
post_max_size = 512M
max_input_time = 600
max_execution_time = 600
